<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="gradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1F6E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A259FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C00FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glowV" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowT" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowN" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip path for rounded rect -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="160" height="160" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- ======= ICON MARK (left square) ======= -->
  <rect x="0" y="0" width="160" height="160" rx="28" ry="28" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines for tech feel -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.8" clip-path="url(#roundedClip)">
    <line x1="0" y1="40" x2="160" y2="40"/>
    <line x1="0" y1="80" x2="160" y2="80"/>
    <line x1="0" y1="120" x2="160" y2="120"/>
    <line x1="40" y1="0" x2="40" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="120" y1="0" x2="120" y2="160"/>
  </g>

  <!-- Abstract corner accent dots -->
  <circle cx="20" cy="20" r="3" fill="#00C9FF" opacity="0.4"/>
  <circle cx="140" cy="140" r="3" fill="#A259FF" opacity="0.4"/>
  <circle cx="140" cy="20" r="3" fill="#FF6B35" opacity="0.3"/>

  <!-- ===== V shape (cyan-blue) ===== -->
  <!-- Left diagonal of V -->
  <polygon points="25,38 47,38 80,108 68,108" fill="url(#gradV)" filter="url(#glowV)" opacity="0.95"/>
  <!-- Right diagonal of V -->
  <polygon points="80,108 92,108 110,68 98,68" fill="url(#gradV)" filter="url(#glowV)" opacity="0.75"/>

  <!-- ===== T shape (orange-pink) – overlapping center ===== -->
  <!-- T crossbar -->
  <rect x="52" y="38" width="72" height="16" rx="4" fill="url(#gradT)" filter="url(#glowT)" opacity="0.90"/>
  <!-- T stem -->
  <rect x="74" y="54" width="16" height="50" rx="4" fill="url(#gradT)" filter="url(#glowT)" opacity="0.85"/>

  <!-- ===== N shape (purple) – right side ===== -->
  <!-- Left vertical of N -->
  <rect x="100" y="50" width="12" height="66" rx="3" fill="url(#gradN)" filter="url(#glowN)" opacity="0.90"/>
  <!-- Diagonal of N -->
  <polygon points="100,50 112,50 136,116 124,116" fill="url(#gradN)" filter="url(#glowN)" opacity="0.80"/>
  <!-- Right vertical of N -->
  <rect x="124" y="50" width="12" height="66" rx="3" fill="url(#gradN)" filter="url(#glowN)" opacity="0.90"/>

  <!-- ======= WORDMARK (right side) ======= -->
  <!-- Company name -->
  <text x="182" y="86"
        font-family="'Segoe UI', 'Trebuchet MS', sans-serif"
        font-weight="800"
        font-size="44"
        letter-spacing="-1"
        fill="#FFFFFF">VTech</text>

  <!-- .ng tag -->
  <text x="182" y="112"
        font-family="'Segoe UI', 'Trebuchet MS', sans-serif"
        font-weight="500"
        font-size="18"
        letter-spacing="3"
        fill="#00C9FF">.ng</text>

  <!-- Tagline -->
  <text x="182" y="132"
        font-family="'Segoe UI', 'Trebuchet MS', sans-serif"
        font-weight="400"
        font-size="11"
        letter-spacing="2.5"
        fill="#6B7280">TECHNOLOGY · SOLUTIONS</text>

  <!-- Accent line under VTech -->
  <rect x="182" y="93" width="180" height="2" rx="1" fill="url(#gradT)" opacity="0.6"/>
</svg>
